name: BetterNotes web demo

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: '3.47.9'
          path: .flutter-sdk
          persist-credentials: false
      - name: Build the browser demo and keep the existing site
        run: |
          export PATH="$GITHUB_WORKSPACE/.flutter-sdk/bin:$PATH"
          flutter build web --base-href "/${GITHUB_REPOSITORY##*/}/demo/"
          mkdir -p build/pages/demo
          cp -a docs/. build/pages/
          cp -a build/web/. build/pages/demo/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
